name: Daily Sheet Verifier

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  run-verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (develop)
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create accounts.json from secret
        run: echo "${{ secrets.ACCOUNTS_JSON }}" | base64 -d > account.json

      - name: Restore sent_links.json cache
        uses: actions/cache@v4
        with:
          path: sent_links.json
          key: sent-links-${{ github.run_id }}
          restore-keys: |
            sent-links-

      - name: Run sheet verifier
        env:
          TEST_MODE: ${{ secrets.TEST_MODE }}
          EMPLOYEE_ALERT_WEBHOOK_URL: ${{ secrets.EMPLOYEE_ALERT_WEBHOOK_URL }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python sheets_verifier.py

      - name: Save sent_links.json cache
        uses: actions/cache@v4
        with:
          path: sent_links.json
          key: sent-links-${{ github.run_id }}
